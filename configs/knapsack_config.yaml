problem:
  type: knapsack
  num_categories: 5
  items_per_category: 4
  n_objectives: 4
  objective_names: ["价值", "重量", "体积", "成本"]
  objective_types: [1, -1, -1, -1]  # 价值最大化，其他最小化
  objective_constraints:
    重量: 50
    体积: 40
    成本: 60

model:
  n_objectives: 4
  hidden_dim: 256
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  dropout: 0.1

data:
  train_dir: data/knapsack/train
  val_dir: data/knapsack/val
  test_dir: data/knapsack/test
  num_workers: 4

training:
  num_episodes: 1000
  max_steps: 100
  learning_rate: 0.001
  gamma: 0.99
  update_every: 4
  batch_size: 64
  buffer_size: 10000
  target_update_freq: 10
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 0.995
  entropy_weight: 0.01

visualization:
  use_english_labels: false 